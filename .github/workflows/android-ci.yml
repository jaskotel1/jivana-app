name: Android CI

on:
  push:
  pull_request:
    branches:
      - master
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Quality, tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-37 build-tools;36.0.0

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run quality checks
        run: ./gradlew qualityCheck --no-daemon

      - name: Run debug unit tests
        run: ./gradlew testDevDebugUnitTest testProdDebugUnitTest --no-daemon

      - name: Build DEV debug APK
        run: ./gradlew assembleDevDebug --no-daemon

      - name: Build PROD debug APK
        run: ./gradlew assembleProdDebug --no-daemon
